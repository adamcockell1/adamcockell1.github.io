<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="My personal portfolio site" />
        <title>Adam's Portfolio</title>
        <link rel="icon" href="./assets/images/favicon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="./src/css/style.css" />
        <script src="./src/js/exif.js" defer></script>
        <script src="./src/js/app.js" defer></script>

    <body>
        <nav class="navDisabled">
            <a
                class="navButton navButtonSquare"

                rel="noreferrer"

            >
                &lt;/&gt;
            </a>
            <a
                class="navButton navButtonSquare"
                href="https://www.linkedin.com/in/adam-cockell"

            <section id="gallery">
                <h2 class="mainTitle">Gallery</h2>

            <section id="blog">

            <button class="navButton" data-target="#splash">Fin</button>
        </footer>
